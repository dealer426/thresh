name: Release thresh

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Get version
      id: version
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $VERSION = "${{ inputs.version }}"
        } else {
          $VERSION = "${{ github.ref_name }}"
        }
        echo "VERSION=$VERSION" >> $env:GITHUB_OUTPUT
        echo "Release version: $VERSION"
      shell: pwsh
      
    - name: Restore dependencies
      run: dotnet restore thresh/Thresh/Thresh.csproj
      
    - name: Publish Native AOT
      run: dotnet publish thresh/Thresh/Thresh.csproj -c Release -r win-x64 --self-contained
      
    - name: Install UPX
      run: |
        Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip" -OutFile upx.zip
        Expand-Archive upx.zip -DestinationPath .
        Move-Item upx-4.2.4-win64/upx.exe $env:GITHUB_WORKSPACE
        echo "$env:GITHUB_WORKSPACE" >> $env:GITHUB_PATH
      shell: pwsh
      
    - name: Get uncompressed binary size
      id: pre_upx_size
      run: |
        $BINARY = "thresh/Thresh/bin/Release/net10.0/win-x64/publish/thresh.exe"
        $size = (Get-Item $BINARY).Length
        $sizeMB = [math]::Round($size / 1MB, 2)
        echo "SIZE_MB=$sizeMB" >> $env:GITHUB_OUTPUT
        echo "Uncompressed binary size: $sizeMB MB"
      shell: pwsh
      
    - name: Compress with UPX
      run: |
        $BINARY = "thresh/Thresh/bin/Release/net10.0/win-x64/publish/thresh.exe"
        upx --best --lzma $BINARY
        echo "UPX compression complete"
      shell: pwsh
      
    - name: Install SBOM tool
      run: dotnet tool install --global Microsoft.Sbom.DotNetTool
      
    - name: Generate SBOM
      run: |
        sbom-tool generate -b thresh/Thresh -bc thresh/Thresh -pn thresh -pv ${{ steps.version.outputs.VERSION }} -ps "dealer426" -nsb https://github.com/dealer426/thresh
        Move-Item -Force thresh/Thresh/_manifest/spdx_2.2/manifest.spdx.json sbom.json
        Remove-Item -Recurse -Force thresh/Thresh/_manifest
      shell: pwsh
      
    - name: Get compressed binary info
      id: binary_info
      run: |
        $BINARY = "thresh/Thresh/bin/Release/net10.0/win-x64/publish/thresh.exe"
        $size = (Get-Item $BINARY).Length
        $sizeMB = [math]::Round($size / 1MB, 2)
        $uncompressed = [double]"${{ steps.pre_upx_size.outputs.SIZE_MB }}"
        $reduction = [math]::Round((1 - ($sizeMB / $uncompressed)) * 100, 2)
        echo "SIZE_MB=$sizeMB" >> $env:GITHUB_OUTPUT
        echo "UNCOMPRESSED_MB=$uncompressed" >> $env:GITHUB_OUTPUT
        echo "REDUCTION=$reduction" >> $env:GITHUB_OUTPUT
        echo "Compressed binary size: $sizeMB MB (was $uncompressed MB, $reduction% reduction)"
      shell: pwsh
      
    - name: Create release archive
      run: |
        cd thresh/Thresh/bin/Release/net10.0/win-x64/publish
        Compress-Archive -Path thresh.exe -DestinationPath thresh-windows-x64.zip
      shell: pwsh
      
    - name: Generate release notes
      id: release_notes
      run: |
        $NOTES = @"
        # thresh ${{ steps.version.outputs.VERSION }}
        
        ## 🚀 AI-Powered WSL Environment Manager
        
        **Single ~4MB UPX-compressed Native AOT binary for Windows**
        
        ### Features
        - ✅ 17 built-in Linux distributions (Vendor + MS Store)
        - ✅ GitHub Copilot SDK integration for AI blueprint generation
        - ✅ MCP server integration for VS Code, Cursor, and Windsurf
        - ✅ System metrics and monitoring with JSON export
        - ✅ Interactive AI chat for environment creation
        - ✅ Custom distribution support with AI discovery
        - ✅ Cross-platform container abstraction (WSL2, containerd)
        - ✅ Zero runtime dependencies
        - ✅ Hybrid distribution system
        - ✅ UPX compressed for minimal size
        
        ### Quick Start
        
        1. Download ``thresh.exe`` or ``thresh-windows-x64.zip``
        2. Ensure GitHub CLI is authenticated: ``gh auth login``
        3. Provision your first environment: ``thresh up alpine-minimal``
        
        See [GETTING_STARTED.md](https://github.com/${{ github.repository }}/blob/main/GETTING_STARTED.md) for full instructions.
        
        ### Binary Info
        - **Platform**: Windows x64
        - **Compressed Size**: ${{ steps.binary_info.outputs.SIZE_MB }} MB (UPX --best --lzma)
        - **Uncompressed Size**: ${{ steps.binary_info.outputs.UNCOMPRESSED_MB }} MB
        - **Size Reduction**: ${{ steps.binary_info.outputs.REDUCTION }}%
        - **Runtime**: Native AOT (no .NET runtime required)
        
        ### Commands
        ``````bash
        thresh up <blueprint>       # Provision environment
        thresh list                 # List environments
        thresh destroy <name>       # Remove environment
        thresh generate <prompt>    # AI blueprint generation
        thresh chat                 # Interactive AI
        thresh metrics              # System metrics
        thresh serve                # Start MCP server
        thresh distros              # List all distributions
        thresh config               # Configuration
        ``````
        
        ### Requirements
        - Windows 11 with WSL2
        - GitHub CLI authenticated (for AI features)
        
        ### What's Changed
        See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
        "@
        
        # Save to file for release creation
        $NOTES | Out-File -FilePath release_notes.md -Encoding UTF8
      shell: pwsh
      
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: thresh ${{ steps.version.outputs.VERSION }}
        body_path: release_notes.md
        draft: false
        prerelease: false
        files: |
          thresh/Thresh/bin/Release/net10.0/win-x64/publish/thresh-windows-x64.zip
          thresh/Thresh/bin/Release/net10.0/win-x64/publish/thresh.exe
          sbom.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
