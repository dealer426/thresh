<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Cracked granite texture pattern (simplified noise for vector) -->
  <defs>
    <filter id="granite" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise"/>
      <feColorMatrix type="matrix" values="0.8 0 0 0 0.2  0 0.8 0 0 0.2  0 0 0.8 0 0.2  0 0 0 1 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Main Chet shape with granite fill -->
  <path 
    d="M 80 300 Q 200 120 320 300 Q 280 240 200 240 Q 120 240 80 300 Z"
    fill="#d0c0b0" 
    stroke="#8b7355" 
    stroke-width="6"
    filter="url(#granite)"
  />

  <!-- Small wheat grain / stone circle with subtle cracks -->
  <circle cx="240" cy="260" r="28" fill="#c9b39a" stroke="#8b7355" stroke-width="3" filter="url(#granite)"/>
  <path d="M 240 232 L 240 288 M 212 260 L 268 260" stroke="#8b7355" stroke-width="2" opacity="0.4"/>

  <!-- Wheat stalk accent (small, subtle) -->
  <g transform="translate(260,180) scale(0.7)">
    <path d="M 0 0 Q 8 -20 0 -40 Q -8 -60 0 -80" fill="none" stroke="#c4a484" stroke-width="4"/>
    <circle cx="0" cy="-80" r="6" fill="#e0c080"/>
    <path d="M -12 -75 L 12 -75 M -10 -85 L 10 -85" stroke="#c4a484" stroke-width="3"/>
  </g>

  <!-- Tiny grain scatter for texture -->
  <circle cx="140" cy="320" r="4" fill="#d2b48c"/>
  <circle cx="180" cy="340" r="3" fill="#d2b48c"/>
  <circle cx="300" cy="310" r="5" fill="#d2b48c"/>
</svg>