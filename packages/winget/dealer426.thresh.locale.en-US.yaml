ReleaseNotes: |-
  Phase 1.5 Complete: Networking, Persistent Storage & WSL Configuration (v1.5.0)
  
  Major Features:
  - Full networking support: port mapping, network modes, hostnames, exposed ports
  - Persistent storage: named volumes, bind mounts, tmpfs mounts
  - WSL configuration profiles: 6 built-in profiles for database optimization
  - Volume management: CLI commands for volume lifecycle
  - Lifecycle management: start/stop commands for environment control
  - Metadata tracking: persistent environment configuration
  
  Platform Support:
  - Windows 11 (WSL2): All features with automatic port forwarding
  - Linux (containerd): Full networking and storage support
  - macOS (Apple Silicon): Beta support
  
  Documentation:
  - Comprehensive tutorials for networking and volumes
  - WSL configuration guide with built-in profiles
  - Complete CLI reference for all new commands
  - Migration guide from v1.4.0
